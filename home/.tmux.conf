# --- General ---
# Focus events support
set-option -g focus-events on

# # True colour support
set-option -a terminal-features 'xterm-256color:RGB'
set -g theme terminal # inherit theme from terminal (tmux version >= 3.8)

# Mouse support
set -g mouse on
# start window numbers at 1 instead of 0
set -g base-index 1
# also start pane numbers at 1
setw -g pane-base-index 1
# go to most recent session on killing current session
set -g detach-on-destroy off
# vi keys in copy mode (h/j/k/l, v to select, y to yank)
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi v if -F '#{selection_present}' { send-keys -X rectangle-off } { send-keys -X begin-selection ; send-keys -X rectangle-off }
bind-key -T copy-mode-vi C-v if -F '#{selection_present}' { send-keys -X rectangle-on } { send-keys -X begin-selection ; send-keys -X rectangle-on }


# --- Colour palette ---
set -g @bar_bg        'colour233'   # status bar background
set -g @bar_fg        'colour248'   # status bar text
set -g @seg_bg        'colour238'   # session/clock segment background
set -g @seg_fg        'colour255'   # session/clock segment text
set -g @accent        '#00ff99'     # current window, messages
# set -g @accent        '#ff0000'     # current window, messages
set -g @border_active 'colour214'   # active pane border


# --- Status Bar ---
set-option -g status-position bottom # top or bottom
set-option -g status-justify centre # justify window list
set -g status-style 'bg=#{@bar_bg},fg=#{@bar_fg}'

# Left side of status bar (Session name)
set -g status-left '#[bg=#{@bar_bg},fg=#{@seg_bg}]#[bg=#{@seg_bg},fg=#{@seg_fg}]#S#[bg=#{@bar_bg},fg=#{@seg_bg}]'
set-option -g status-left-length 30

# Right side of status bar (time, date, day of week)
set -g status-right '#[bg=#{@bar_bg},fg=#{@seg_bg}]#[bg=#{@seg_bg},fg=#{@seg_fg}] %H:%M | %Y-%m-%d | %A#[bg=#{@bar_bg},fg=#{@seg_bg}]'
set-option -g status-right-length 40

# Window list
setw -g window-status-format '#[fg=#{@bar_fg}] #I:#W '

# Current window name
setw -g window-status-current-style 'bold'
setw -g window-status-current-format '#[bg=#{@bar_bg},fg=#{@accent}]#[bg=#{@accent},fg=#{@bar_bg}] #I:#W #[bg=#{@bar_bg},fg=#{@accent}]'

# Open command line in new line
bind-key : command-prompt -P

# 1-indexed shortcut keys in session/window tree (1-9, then M-a..M-z)
set -g @tree_keys '#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'
bind-key s choose-tree -Zs -K '#{E:@tree_keys}'
bind-key w choose-tree -Zw -K '#{E:@tree_keys}'

# --- Panes ---
set -g pane-border-style 'fg=#{@seg_bg}'
set -g pane-active-border-style 'fg=#{@border_active}'

# --- Messages ---
set -g message-style 'bg=#{@accent},fg=#{@bar_bg}'

# floating popup for sessionizer
bind-key C-f display-popup -E -w 90% -h 80% "$HOME/.tmux/plugins/tmux-sessionizer/tmux-sessionizer"

# image.nvim requirements
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on


#### PLUGINS ####
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'ThePrimeagen/tmux-sessionizer'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '$HOME/.tmux/plugins/tpm/tpm'
