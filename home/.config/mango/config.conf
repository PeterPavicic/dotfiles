###### APPEARANCE: VARIABLES ######
# Gaps, borders
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=0
gap_outer_vertical=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
border_radius=10
no_radius_when_single=0

# Border colours
root_color=0x201b14ff # background window when no background is on
border_color=0x444444ff # inactive window color
drop_color=0x8FBA7C55 # Drop shadow when dragging windows
split_color=0xEB441EFF # Split window border color in manual dwindle layout
# Mango's colour: #A6CA3F Lasko colour: #057731 Snoopy colour: "#F26516"
focus_color=0x9B410EFF # Active window border
maximized_screen_color=0x2B8743FF
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff


# Blur effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 5
blur_params_noise = 0.03
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

# Focused/Unfocused
focused_opacity=1.0
unfocused_opacity=0.7
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

###### APPEARANCE: ANIMATIONS ######
# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1


###### LAYOUTS ######
tag_num=10
# Layouts to cycle through
circle_layout=tile,monocle,scroller,fair,vertical_tile

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:vertical_scroller
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:monocle # pdf files
tag_rule=id:5,layout_name:monocle # file editor
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile
tag_rule=id:10,layout_name:tile

# Tile (Master-Stack) Layout Setting
new_is_master=0
default_master_factor=0.54 # no blur at 0.54
default_master_count=1

# Monocle Layout Setting
monocle_tab_mode=1 # Auto merge stacked windows into a tab in monocle layout.
monocle_right_button_close=0 # Right click on the tab bar closes that window.
monocle_no_border=0 # Remove window borders from tiled windows (including maximized ones) while the monocle layout is active.
monocle_no_gap=0 # Remove gaps around tiled windows (including maximized ones) while the monocle layout is active.
monocle_no_radius=0 # Remove window corner radii (including maximized ones) while the monocle layout is active.

# Scroller Layout Setting
scroller_structs=2 # Width reserved on sides when window ratio is 1.
scroller_default_proportion=0.92 # Default width proportion for new windows.
scroller_focus_center=1 # Always center the focused window (1 = enable).
scroller_prefer_center=0 # Center focused window only if it was outside the view.
scroller_prefer_overspread=1 # Allow windows to overspread when there's extra space.
edge_scroller_pointer_focus=1 # Focus windows even if partially off-screen.
edge_scroller_focus_allow_speed=0.0 # Allow pointer focus to happen if the pointer moves at a speed greater than this value.
scroller_proportion_preset=0.5,0.8,1.0 # Presets for cycling window widths.
scroller_ignore_proportion_single=0 # Ignore proportion adjustments for single windows.
scroller_default_proportion_single=1.0 # Default proportion for single windows in scroller. Requires scroller_ignore_proportion_single=0 to take effect.

# Dwindle Layout Setting
dwindle_split_ratio=0.54 # Ratio used for new splits (0.05–0.95).
dwindle_smart_split=0 # Pick the split axis from the cursor's position inside the focused window. The new window appears on the cursor's side.
dwindle_horizontal_split=1 # Side-by-side splits: where the new window goes. 0 = follow cursor, 1 = right, 2 = left.
dwindle_vertical_split=1 # Top/bottom splits: where the new window goes. 0 = follow cursor, 1 = below, 2 = above.
dwindle_preserve_split=0 # Keep the sibling's split orientation when a window is closed.
dwindle_smart_resize=0 # When dragging to resize, move the split toward the cursor regardless of which side was grabbed.
dwindle_drop_simple_split=1 # Drag-to-tile drop preview. 1 = 2-zone preview matching dwindle_split_ratio, 0 = 4-quadrant preview.
dwindle_manual_split=0 # Manually split windows mode.

# tab bar
tab_bar_height=32 # Height of the auto tab bar.
tab_bar_decorate_fg_color=0xc0caf5ff # text color.
tab_bar_decorate_bg_color=0x1d2021ff # background color.
tab_bar_decorate_focus_fg_color=0x7aa2f7ff # text color for focus.
tab_bar_decorate_focus_bg_color=0x3c3836ff # background color for focus.
tab_bar_decorate_border_color=0x3b4261ff # border color.
tab_bar_decorate_border_width=2 # border width.
tab_bar_decorate_corner_radius=10 # corner radius.
tab_bar_decorate_padding_x=0 # horizontal padding.
tab_bar_decorate_padding_y=0 # vertical padding.
tab_bar_decorate_font_desc=sans 12 # font set.

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1


###### INPUT ######

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us,hu,si
# xkb_rules_variant=
xkb_rules_options=caps:escape

# Trackpad
# need relogin to make it apply
disable_trackpad=0 # Set to 1 to disable the trackpad entirely.
tap_to_click=1 # Tap to trigger a left click.
tap_and_drag=1 # Tap and hold to drag items.
trackpad_natural_scrolling=1 # Invert scrolling direction (natural scrolling).
trackpad_accel_profile=2 # 0 (None), 1 (Flat), 2 (Adaptive).
trackpad_accel_speed=0.2 # Speed adjustment (-1.0 to 1.0).
trackpad_scroll_button=274 # The button used for button scrolling (272–279).
trackpad_scroll_method=1 # 1 (Two-finger), 2 (Edge), 4 (Button).
trackpad_click_method=1 # 1 (Button areas), 2 (Clickfinger).
trackpad_send_events_mode=0 # 0 (Enabled), 1 (Disabled), 2 (Disabled on external mouse).
drag_lock=0 # Lock dragging after tapping.
trackpad_disable_while_typing=1 # Disable trackpad while typing.
trackpad_left_handed=0 # Swap left/right buttons.
trackpad_middle_button_emulation=1 # Emulate middle button.
swipe_min_threshold=1 # Minimum swipe threshold when use gesture.
gesture_live=1 # Drive tag/focus/overview transitions while the fingers are still moving (1), instead of only after release (0).
gesture_swipe_distance=300 # Finger travel (px) that corresponds to one full page transition.
gesture_swipe_cancel_ratio=0.5 # Releasing after the last page was dragged past this fraction commits it; below it, the transition animates back.
gesture_swipe_min_speed_to_force=10 # Average per-event speed (px) that forces a commit even below the cancel ratio (for quick flicks).
button_map=0 # 0 (Left/right/middle), 1 (Left/middle/right).
trackpad_scroll_factor=1.0 # Scroll factor for trackpad scroll speed (0.1–10.0).


# TEST: mouse on PC
mouse_natural_scrolling=0 # Invert scrolling direction.
mouse_accel_profile=2 # 0 (None), 1 (Flat), 2 (Adaptive).
mouse_accel_speed=0.2 # Speed adjustment (-1.0 to 1.0).
mouse_left_handed=0 # Swap left and right buttons.
mouse_middle_button_emulation=0 # Emulate middle button.
mouse_scroll_method=4 # 1 (Two-finger), 2 (Edge), 4 (Button).
mouse_scroll_button=274 # The button used for button scrolling (272–279).
mouse_click_method=1 # 1 (Button areas), 2 (Clickfinger).
mouse_send_events_mode=0 # 0 (Enabled), 1 (Disabled), 2 (Disabled on external mouse).
axis_scroll_factor=1.0 # Scroll factor for axis scroll speed (0.1–10.0).


###### KEYBINDINGS ######
# mod keys name: super,ctrl,alt,shift,none


# change keyboard layout
bindl=SUPER,space,spawn_shell,$HOME/.config/mango/switchKeyboardLayout.sh

# reload config
bind=SUPER,R,reload_config

bind=SUPER,B,spawn_shell, $HOME/.config/mango/cycle-power-profile.sh

# rofi menus and programs

# launcher
bind=ALT,space,spawn,rofi -show drun
bind=SUPER,backslash,spawn,rofi -show drun
bind=SUPER,less,spawn,rofi -show drun
# Uncomment to debug
bind=SUPER,W,spawn_shell,pkill rofi || rofi -show window
# powermenu


bind=SUPER,X,spawn_shell,pkill rofi || rofi -show power-menu -modi power-menu:$HOME/.config/rofi/rofi-power-menu/rofi-power-menu
# wifi menu
bind=SUPER,I,spawn_shell,pkill rofi || bash $HOME/.config/rofi/rofi-wifi-menu/rofi-wifi-menu.sh
# calculator
bind=SUPER,C,spawn_shell,uwsm-app -- rofi -show calc -modi calc -no-show-match -no-sort
bind=SUPER,period,spawn_shell,rofi -modi emoji -show emoji
# file search
bind=SUPER,slash,spawn_shell,pkill rofi || rofi -show recursivebrowser

# Program keybinds
bind=SUPER,Return,spawn,uwsm-app -- kitty
bind=SUPER,KP_Enter,spawn,uwsm-app -- kitty
bind=SUPER,E,spawn_shell,uwsm-app -- thunar

# Paste history
bind=SUPER,V,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy

# screenshot
bind=SUPER+SHIFT,s,spawn_shell,$HOME/.config/mango/screenshot.sh region
bind=NONE,Print,spawn_shell,$HOME/.config/mango/screenshot.sh fullscreen
bind=SHIFT,Print,spawn_shell,$HOME/.config/mango/screenshot.sh window

# exit
bind=SUPER,Q,killclient

# switch window focus
bind=SUPER,grave,focusstack,next
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,J,move_client,down
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,L,move_client,right

# switch window status
bind=SUPER,G,toggleglobal,
bind=SUPER,F,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
# bind=SUPER,I,minimized,
# bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,Next,minimized, # PageDown
bind=SUPER,Prior,restore_minimized # PageUp
bind=SUPER,O,toggleoverlay,

# TODO: Figure out special tag/scratchpad
# bind=SUPER,S,toggle_special_tag
# bind=SUPER+CTRL,s,tag_special_tag

# Layout keybindings

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT+SUPER+CTRL,Left,scroller_stack,left
bind=ALT+SUPER+CTRL,Right,scroller_stack,right
bind=ALT+SUPER+CTRL,Up,scroller_stack,up
bind=ALT+SUPER+CTRL,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,N,spawn_shell,$HOME/.config/mango/switchLayout.sh

# tag switch
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0

