###### WINDOW RULES ######
# Set window rules that apply to every times when the window is opened
# is_tag_silent: Do not focus if tag currently not in focus

# Volume
window_rule=app_id:org.pulseaudio.pavucontrol,is_floating:1,is_overlay:1,is_global:1,no_force_center:0,offset_x:100,offset_y:-100,width:600,height:360
# Bluetooth
window_rule=app_id:blueman-manager,is_floating:1,is_overlay:1,is_global:1,no_force_center:0,offset_x:100,offset_y:-100,width:560,height:350
# Network Manager
window_rule=app_id:nm-connection-editor,is_floating:1,is_overlay:1,is_global:1,no_force_center:0,width:860,height:560
# Polkit
window_rule=app_id:polkit-gnome-authentication-agent-1,is_floating:1,is_overlay:1,is_global:1,no_force_center:0

# Ghostty
window_rule_once=app_id:com.mitchellh.ghostty,tags:1
# Kitty
window_rule_once=app_id:kitty,tags:1

# Firefox
window_rule=app_id:firefox,tags:2
# Typst
window_rule=app_id:firefox,title:Typst Preview,tags:1
# Chromium
window_rule=app_id:chromium,tags:3
# PDFs
window_rule=app_id:org.pwmt.zathura,tags:4,no_border:1,no_radius:0
# GIMP
window_rule=app_id:gimp,tags:6,unfocused_opacity:1 # disable changing opacity when unfocused
# VLC
window_rule=app_id:vlc,tags:7
# TODO: Consider moving this to special workspace?
# Apple Music
window_rule=title:Apple Music,tags:8,force_fake_maximize:1
# WhatsApp Web
window_rule=title:WhatsApp Web,tags:9,force_fake_maximize:1

# Satty
window_rule=app_id:com.gabm.satty,is_floating:1,no_force_center:0,width:860,height:560

# Rename window
window_rule=app_id:thunar,title:Rename,is_floating:1,no_force_center:0,width:860,height:560

# Open GTK window
window_rule=app_id:xdg-desktop-portal-gtk,title:Open,is_floating:1,no_force_center:0,width:1100,height:600
# Select GTK window
window_rule=app_id:xdg-desktop-portal-gtk,title:Select,is_floating:1,no_force_center:0,width:1100,height:600
# Choose GTK window
window_rule=app_id:xdg-desktop-portal-gtk,title:Choose,is_floating:1,no_force_center:0,width:1100,height:600
# Save GTK window
window_rule=app_id:xdg-desktop-portal-gtk,title:Save,is_floating:1,no_force_center:0,width:1100,height:600
# Save GTK window
window_rule=app_id:xdg-desktop-portal-gtk,title:All Files,is_floating:1,no_force_center:0,width:1100,height:600
# Upload GTK window
window_rule=app_id:xdg-desktop-portal-gtk,title:Upload,is_floating:1,no_force_center:0,width:1100,height:600

###### LAYER RULES ######
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi


###### TAG RULES ######
# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:vertical_scroller
tag_rule=id:3,layout_name:vertical_scroller
tag_rule=id:4,layout_name:monocle # pdf files
tag_rule=id:5,layout_name:monocle # file editor
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile
tag_rule=id:10,layout_name:tile
