###### MOUSE BINDINGS ######
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gestures
gesture_live=1 # Drive tag/focus/overview transitions while the fingers are still moving (1), instead of only after release (0).
gesturebind=none,right,3,viewtoleft_have_client
gesturebind=none,left,3,viewtoright_have_client

# TODO: Figure out better gestures
gesturebind=none,up,3,enteroverview
gesturebind=none,down,3,leaveoverview

gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

###### BRIGHTNESS & AUDIO ######
# Audio
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# Media control through playerctl
binds=NONE,XF86AudioPlay,spawn,playerctl play-pause
binds=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next

# alternatives using Pause, Scroll_Lock
bind=NONE,Pause,spawn,playerctl play-pause
bind=NONE,Scroll_Lock,spawn,playerctl next
bind=SHIFT,Scroll_Lock,spawn,playerctl previous
