###### GENERAL ######
# TODO: Set up hyprpicker

# Change keyboard layout
bindl=SUPER,space,spawn_shell,$HOME/.config/mango/scripts/switchKeyboardLayout.sh

# Powerprofile
bind=SUPER,B,spawn_shell, $HOME/.config/mango/scripts/cycle-power-profile.sh

# Exit
bind=SUPER,Q,killclient

# Program keybinds
bind=SUPER,Return,spawn,uwsm-app -- kitty
bind=SUPER,KP_Enter,spawn,uwsm-app -- kitty
bind=SUPER,E,spawn_shell,uwsm-app -- thunar

# Screenshot
bind=SUPER+SHIFT,s,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh region
bind=NONE,Print,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh fullscreen
bind=SHIFT,Print,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh window

###### ROFI ######
# launcher
bind=ALT,space,spawn,rofi -show drun
bind=SUPER,backslash,spawn,rofi -show drun
bind=SUPER,less,spawn,rofi -show drun

# Uncomment to debug
bind=SUPER,W,spawn_shell,pkill rofi || rofi -show window

# powermenu
bind=SUPER,X,spawn_shell,pkill rofi || rofi -show power-menu -modi power-menu:$HOME/.config/rofi/rofi-power-menu/rofi-power-menu

# wifi menu
bind=SUPER,I,spawn_shell,pkill rofi || bash $HOME/.config/rofi/rofi-wifi-menu/rofi-wifi-menu.sh

# calculator
bind=SUPER,C,spawn_shell,uwsm-app -- rofi -show calc -modi calc -no-show-match -no-sort
bind=SUPER,period,spawn_shell,rofi -modi emoji -show emoji

# file search
bind=SUPER,slash,spawn_shell,pkill rofi || rofi -show recursivebrowser

# Paste history
bind=SUPER,V,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy

# TODO: Special tag/workspace
# bind=SUPER,S,toggle_special_tag
# bind=SUPER+CTRL,s,tag_special_tag

###### WINDOW KEYBINDS ######
# TODO: Submaps for navigation

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,previous
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,J,move_client,down
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,L,move_client,right

# switch window status
bind=SUPER,G,toggleglobal,
bind=SUPER,F,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
# bind=SUPER,I,minimized,
# bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,Next,minimized, # PageDown
bind=SUPER,Prior,restore_minimized # PageUp
bind=SUPER,O,toggleoverlay,


###### LAYOUT KEYBINDS ######
# Scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT+SUPER+CTRL,Left,scroller_stack,left
bind=ALT+SUPER+CTRL,Right,scroller_stack,right
bind=ALT+SUPER+CTRL,Up,scroller_stack,up
bind=ALT+SUPER+CTRL,Down,scroller_stack,down

# Dwindle layout(manual split mode)
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# Switch layout
bind=SUPER,N,spawn_shell,$HOME/.config/mango/scripts/switchLayout.sh

# Tag switch
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0
