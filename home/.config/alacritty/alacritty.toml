[general]
import = [
    "$HOME/.config/alacritty/themes/themes/tokyo_night.toml",
    # "$HOME/.config/alacritty/themes/themes/tokyo_night_storm.toml",
    # "$HOME/.config/alacritty/themes/themes/tokyo_night_enhanced.toml",
]

[window]
# Change this on Hyprland
opacity=1.0

[font]
normal = { family = "FiraCode Nerd Font", style = "Retina" }
# normal = { family = "FiraCode Nerd Font", style = "Regular" } 
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Retina" } 
# normal = { family = "FiraCode Nerd Font", style = "Regular" } 
bold_italic = { family = "FiraCode Nerd Font", style = "SemiBold" } 

size = 12.20

[colors]
draw_bold_text_with_bright_colors = false
