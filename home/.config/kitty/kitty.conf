# Tokyo Night theme (copied from tokyonight.nvim extras/kitty)
include tokyonight_night.conf

auto_reload_config 0.1

## zoom in with Ctrl+= or Ctrl+Plus
map ctrl+equal   change_font_size all +0.5
map ctrl+plus    change_font_size all +0.5

## zoom out with Ctrl+-
map ctrl+minus   change_font_size all -0.5

# reset zoom with Ctrl+0
map ctrl+0   change_font_size all 0

# no changing opacity
dynamic_background_opacity no


# font setup
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12
